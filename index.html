<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квадратне рівняння</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Перемкнути тему" title="Перемкнути темну/світлу тему">🌙</button>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Математичний калькулятор</p>
      <h1>Квадратне рівняння</h1>
      <p>Введи коефіцієнти <strong>a</strong>, <strong>b</strong> і <strong>c</strong>, натисни кнопку, і результат з’явиться внизу сторінки.</p>
      <div class="formula">ax² + bx + c = 0</div>
    </section>

    <section class="panel" aria-label="Калькулятор квадратного рівняння">
      <div class="fields">
        <label>
          a
          <input id="a" type="number" step="any" value="1" inputmode="decimal">
        </label>
        <label>
          b
          <input id="b" type="number" step="any" value="-3" inputmode="decimal">
        </label>
        <label>
          c
          <input id="c" type="number" step="any" value="2" inputmode="decimal">
        </label>
      </div>

      <button id="solveBtn" type="button">Розв’язати</button>

      <div class="result" id="result" aria-live="polite">
        <h2>Рішення</h2>
        <p>Тут з’явиться відповідь після натискання кнопки.</p>
      </div>
    </section>
  </main>

  <script>
    /* ── Theme toggle ── */
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Увімкнути світлу тему' : 'Увімкнути темну тему');
      localStorage.setItem('theme', theme);
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        applyTheme(saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }
    })();

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      themeToggle.classList.remove('spin');
      void themeToggle.offsetWidth; /* reflow to restart animation */
      themeToggle.classList.add('spin');
    });

    themeToggle.addEventListener('animationend', () => themeToggle.classList.remove('spin'));

    /* ── Calculator ── */
    const aInput = document.getElementById('a');
    const bInput = document.getElementById('b');
    const cInput = document.getElementById('c');
    const solveBtn = document.getElementById('solveBtn');
    const result = document.getElementById('result');

    function formatNumber(value) {
      const rounded = Math.abs(value) < 1e-12 ? 0 : value;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    }

    function renderMessage(title, message, tone = '') {
      result.classList.remove('updated');
      void result.offsetWidth; /* reflow to restart animation */
      result.innerHTML = `
        <h2>Рішення</h2>
        <p class="${tone}">${title}</p>
        <p>${message}</p>
      `;
      result.classList.add('updated');
    }

    function solveQuadratic() {
      const a = Number(aInput.value);
      const b = Number(bInput.value);
      const c = Number(cInput.value);

      if ([a, b, c].some((value) => Number.isNaN(value))) {
        renderMessage('Помилка', 'Будь ласка, заповни всі поля числами.', 'warn');
        return;
      }

      if (a === 0) {
        if (b === 0) {
          if (c === 0) {
            renderMessage('Нескінченно багато розв’язків', 'Усі значення x підходять, бо рівняння перетворюється на 0 = 0.', 'good');
          } else {
            renderMessage('Розв’язків немає', 'При a = 0 і b = 0 маємо суперечність: c = 0 не виконується.', 'warn');
          }
          return;
        }

        const root = -c / b;
        renderMessage('Лінійне рівняння', `Оскільки a = 0, рівняння стає лінійним. Корінь: x = ${formatNumber(root)}.`, 'good');
        return;
      }

      const discriminant = b * b - 4 * a * c;

      if (discriminant > 0) {
        const x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
        const x2 = (-b - Math.sqrt(discriminant)) / (2 * a);
        renderMessage(
          'Два дійсні корені',
          `D = ${formatNumber(discriminant)}. x1 = ${formatNumber(x1)}, x2 = ${formatNumber(x2)}.`,
          'good'
        );
        return;
      }

      if (discriminant === 0) {
        const x = -b / (2 * a);
        renderMessage('Один дійсний корінь', `D = 0. Подвійний корінь: x = ${formatNumber(x)}.`, 'good');
        return;
      }

      const realPart = -b / (2 * a);
      const imaginaryPart = Math.sqrt(Math.abs(discriminant)) / (2 * a);
      renderMessage(
        'Комплексні корені',
        `D = ${formatNumber(discriminant)}. x1 = ${formatNumber(realPart)} + ${formatNumber(imaginaryPart)}i, x2 = ${formatNumber(realPart)} - ${formatNumber(imaginaryPart)}i.`,
        'warn'
      );
    }

    solveBtn.addEventListener('click', solveQuadratic);
  </script>
</body>
</html>
